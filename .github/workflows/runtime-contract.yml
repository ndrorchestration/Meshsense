name: Runtime Contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start service
        run: |
          node server.js > /tmp/meshsense-runtime.log 2>&1 &
          echo $! > /tmp/meshsense.pid
          sleep 1
      - name: Verify core endpoint contract
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:3000/ | grep -q 'MeshSense / RuView Status'
          curl --fail --silent --show-error http://127.0.0.1:3000/health | node -e '
            let s=""; process.stdin.on("data", d=>s+=d); process.stdin.on("end", ()=>{const x=JSON.parse(s); if(x.service!=="meshsense-ruview-status"||x.state!=="operational"||x.evidenceLevel!=="runtime-surface") process.exit(1);});
          '
          curl --fail --silent --show-error http://127.0.0.1:3000/api/status | node -e '
            let s=""; process.stdin.on("data", d=>s+=d); process.stdin.on("end", ()=>{const x=JSON.parse(s); if(x.service!=="meshsense-ruview-status"||x.state!=="operational"||x.evidenceLevel!=="runtime-surface") process.exit(1);});
          '
      - name: Verify pathname routing survives query parameters
        run: |
          set -euo pipefail
          curl --fail --silent --show-error 'http://127.0.0.1:3000/health?probe=ci' | grep -q '"service":"meshsense-ruview-status"'
          curl --fail --silent --show-error 'http://127.0.0.1:3000/api/status?probe=ci' | grep -q '"service":"meshsense-ruview-status"'
      - name: Verify unknown route fails closed
        run: |
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/not-a-route)" = "404"
      - name: Stop service
        if: always()
        run: |
          test -f /tmp/meshsense.pid && kill "$(cat /tmp/meshsense.pid)" || true
